name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse JSON manifests
        run: |
          set -euo pipefail
          for f in \
            .claude-plugin/marketplace.json \
            chatgpt/plugin.json \
            chatgpt/mcp.json
          do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
          echo "All manifests parse"

      - name: Check OpenAI specialist skills
        run: |
          set -euo pipefail
          for ROLE in trove-librarian trove-item-reader trove-book-writer trove-book-enricher; do
            SKILL="chatgpt/skills/$ROLE/SKILL.md"
            [ -f "$SKILL" ] || { echo "::error::missing OpenAI specialist workflow: $SKILL"; exit 1; }
          done
          for DIR in chatgpt/skills/*/; do
            [ -f "${DIR}SKILL.md" ] || { echo "::error::${DIR} has no SKILL.md"; exit 1; }
          done

      - name: Check the retired Claude marketplace
        run: |
          set -euo pipefail
          # The trove-cowork plugin was removed on 2026-11-02. The marketplace
          # stays so that existing installs learn about it: Claude Code follows
          # "renames" and reports the plugin as removed instead of
          # plugin-not-found. Never delete the renames entry.
          MARKET=.claude-plugin/marketplace.json
          [ "$(jq -r '.name' "$MARKET")" = "trove" ] || { echo "::error::marketplace name must be trove"; exit 1; }
          [ "$(jq -r '.plugins | length' "$MARKET")" = "0" ] || { echo "::error::the marketplace must list no plugins"; exit 1; }
          [ "$(jq -r '.renames | has("trove-cowork")' "$MARKET")" = "true" ] \
            && [ "$(jq -r '.renames["trove-cowork"]' "$MARKET")" = "null" ] \
            || { echo "::error::marketplace.json must keep \"renames\": {\"trove-cowork\": null}"; exit 1; }
          [ ! -e plugins/trove-cowork ] || { echo "::error::plugins/trove-cowork was removed; do not add it back"; exit 1; }
          echo "Retired marketplace is intact"

      - name: Check for old brand names
        run: |
          set -euo pipefail
          # Allowed: CHANGELOG files, the GitHub org name, and the agreed
          # bridge lines that say CandleKeep is Trove's former name.
          HITS=$(grep -rniE 'candlekeep|getcandlekeep' . \
                   --exclude-dir=.git \
                   --exclude=CHANGELOG.md \
                   --exclude=validate.yml \
                 | sed -E 's/CandleKeepAgents//g' \
                 | grep -iE 'candlekeep' \
                 | grep -viE 'former name of Trove|formerly called CandleKeep' \
                 || true)
          if [ -n "$HITS" ]; then
            echo "::error::old brand name found outside the allowed places:"
            echo "$HITS"
            exit 1
          fi
          echo "No stray old brand names"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: claude plugin validate
        run: |
          set -euo pipefail
          # Pinned so CI is reproducible. Raise it deliberately. It must be
          # 2.1.193 or later, which reads the "renames" map.
          # Not --strict: strict mode turns the "no plugins defined" warning
          # into an error, and the empty plugin list is on purpose. Errors,
          # such as a broken renames chain, still fail the step.
          npm install -g @anthropic-ai/claude-code@2.1.285
          claude plugin validate .
